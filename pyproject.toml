[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hakkuai"
version = "0.1.0"
description = "HakkuAI: AI-powered government welfare assistance agent for Indian workers (Fetch-A-Thon 3.0)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HakkuAI Team" }
]
dependencies = [
    "uagents>=0.26.1",
    "uagents-core>=0.4.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "aiohttp>=3.9.0"
]

[project.scripts]
hakkuai = "hakkuai.agent:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
